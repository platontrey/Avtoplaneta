http:
  middlewares:
    dashboard-auth:
      basicAuth:
        users:
          - "${DASHBOARD_USER}:${DASHBOARD_PASSWORD}"
    
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
    
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m

    compress-res:
      compress:
        encodings:
          - br
          - gzip

    auth-forward:
      forwardAuth:
        address: "http://auth-service:8083/auth/verify"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-User-ID"
          - "X-User-Email"
          - "X-User-Name"
          - "X-User-Role"

    auth-forward-admin:
      forwardAuth:
        address: "http://auth-service:8083/auth/verify-admin"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-User-ID"
          - "X-User-Email"
          - "X-User-Name"
          - "X-User-Role"
