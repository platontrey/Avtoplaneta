api:
  dashboard: true
  insecure: false

ping: {}

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: avtoplaneta_avtoplaneta_network
  file:
    filename: /etc/traefik/dynamic/middleware.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "platontrey5@gmail.com"
      storage: "/etc/traefik/acme.json"
      tlsChallenge: {}

log:
  level: INFO

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
