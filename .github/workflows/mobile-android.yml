name: Build Android app

on:
  push:
    branches:
      - OptimizedBackend
      - main
    tags:
      - "v*"
    paths:
      - "AvtoplanetaApp/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    branches:
      - OptimizedBackend
      - main
    paths:
      - "AvtoplanetaApp/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: AvtoplanetaApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: AvtoplanetaApp

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

  build:
    name: Build APK
    needs: quality
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 30

    defaults:
      run:
        working-directory: AvtoplanetaApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: AvtoplanetaApp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: >-
          sdkmanager
          "platform-tools"
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;27.0.12077973"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: >-
          taskset --cpu-list 0-15
          flutter build apk --release --no-pub
          --build-number="${{ github.run_number }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: avtoplaneta-android-${{ github.sha }}
          path: AvtoplanetaApp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 9

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_asset="build/app/outputs/flutter-apk/avtoplaneta-${GITHUB_REF_NAME}.apk"
            cp "${apk_path}" "${release_asset}"
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "${release_asset}" --clobber
            else
              gh release create "${GITHUB_REF_NAME}" "${release_asset}" \
                --title "Автопланета ${GITHUB_REF_NAME}" \
                --generate-notes
            fi
          elif [[ "${GITHUB_REF_NAME}" == "${{ github.event.repository.default_branch }}" || "${GITHUB_REF_NAME}" == "OptimizedBackend" ]]; then
            release_asset="build/app/outputs/flutter-apk/avtoplaneta-latest.apk"
            cp "${apk_path}" "${release_asset}"
            release_tag="mobile-latest"
            release_title="Автопланета — актуальная Android-сборка"
            release_notes="Автоматическая сборка из ${GITHUB_REF_NAME} (${GITHUB_SHA})."

            if gh release view "${release_tag}" >/dev/null 2>&1; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" \
                -f sha="${GITHUB_SHA}" \
                -F force=true >/dev/null 2>&1 || true
              gh release upload "${release_tag}" "${release_asset}" --clobber
              gh release edit "${release_tag}" \
                --title "${release_title}" \
                --notes "${release_notes}" \
                --latest
            else
              gh release create "${release_tag}" "${release_asset}" \
                --target "${GITHUB_SHA}" \
                --title "${release_title}" \
                --notes "${release_notes}" \
                --latest
            fi
          fi
