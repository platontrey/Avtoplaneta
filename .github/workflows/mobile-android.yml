name: Build Android app

on:
  push:
    branches:
      - OptimizedBackend
      - main
    tags:
      - "v*"
    paths:
      - "AvtoplanetaApp/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    branches:
      - OptimizedBackend
      - main
    paths:
      - "AvtoplanetaApp/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: AvtoplanetaApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: AvtoplanetaApp

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

  build:
    name: Build APK
    needs: quality
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 30
    permissions:
      contents: write

    defaults:
      run:
        working-directory: AvtoplanetaApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APKs in parallel
        shell: bash
        run: |
          BUILD_NUM="${{ github.run_number }}"
          echo "=== Запуск параллельной компиляции APK (arm64-v8a и armeabi-v7a) ==="

          # Создаем изолированные каталоги для исключения конфликтов блокировок
          TEMP_ROOT=$(mktemp -d /tmp/flutter-build-XXXXXX)
          mkdir -p "$TEMP_ROOT/arm64" "$TEMP_ROOT/armv7"

          # Копирование исходников без кэша сборки
          cp -R . "$TEMP_ROOT/arm64/"
          cp -R . "$TEMP_ROOT/armv7/"

          # Поток 1: arm64-v8a на ядрах 0-7
          (
            echo "[arm64] Старт сборки на ядрах 0-7..."
            cd "$TEMP_ROOT/arm64"
            taskset --cpu-list 0-7 flutter build apk --release --no-pub \
              --target-platform android-arm64 \
              --build-number="$BUILD_NUM"
            echo "[arm64] Сборка успешно завершена!"
          ) > "$TEMP_ROOT/arm64.log" 2>&1 &
          PID_ARM64=$!

          # Поток 2: armeabi-v7a на ядрах 8-15
          (
            echo "[armv7] Старт сборки на ядрах 8-15..."
            cd "$TEMP_ROOT/armv7"
            taskset --cpu-list 8-15 flutter build apk --release --no-pub \
              --target-platform android-arm \
              --build-number="$BUILD_NUM"
            echo "[armv7] Сборка успешно завершена!"
          ) > "$TEMP_ROOT/armv7.log" 2>&1 &
          PID_ARMV7=$!

          # Ожидание параллельного завершения
          wait $PID_ARM64
          STATUS_ARM64=$?

          wait $PID_ARMV7
          STATUS_ARMV7=$?

          echo "--- Лог сборки arm64-v8a ---"
          cat "$TEMP_ROOT/arm64.log"
          echo "--- Лог сборки armeabi-v7a ---"
          cat "$TEMP_ROOT/armv7.log"

          if [ $STATUS_ARM64 -ne 0 ]; then
            echo "Ошибка при сборке APK arm64-v8a (exit code $STATUS_ARM64)"
            rm -rf "$TEMP_ROOT"
            exit $STATUS_ARM64
          fi

          if [ $STATUS_ARMV7 -ne 0 ]; then
            echo "Ошибка при сборке APK armeabi-v7a (exit code $STATUS_ARMV7)"
            rm -rf "$TEMP_ROOT"
            exit $STATUS_ARMV7
          fi

          # Копируем результаты в структуру build/
          mkdir -p build/app/outputs/flutter-apk
          cp "$TEMP_ROOT/arm64/build/app/outputs/flutter-apk/app-release.apk" \
             build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          cp "$TEMP_ROOT/armv7/build/app/outputs/flutter-apk/app-release.apk" \
             build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

          rm -rf "$TEMP_ROOT"

      - name: Prepare release asset
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p release
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/avtoplaneta-${GITHUB_REF_NAME}-arm64.apk"
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release/avtoplaneta-${GITHUB_REF_NAME}-armv7.apk"
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/avtoplaneta-${GITHUB_REF_NAME}.apk"
          else
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/avtoplaneta-latest-arm64.apk"
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release/avtoplaneta-latest-armv7.apk"
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/avtoplaneta-latest.apk"
          fi

      - name: Publish tag release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: AvtoplanetaApp/release/avtoplaneta-*.apk
          name: Автопланета ${{ github.ref_name }}
          generate_release_notes: true

      - name: Publish latest mobile release
        if: >-
          github.event_name == 'push' &&
          !startsWith(github.ref, 'refs/tags/') &&
          (github.ref_name == github.event.repository.default_branch || github.ref_name == 'OptimizedBackend')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: mobile-latest
          target_commitish: ${{ github.sha }}
          files: |
            AvtoplanetaApp/release/avtoplaneta-latest.apk
            AvtoplanetaApp/release/avtoplaneta-latest-arm64.apk
            AvtoplanetaApp/release/avtoplaneta-latest-armv7.apk
          name: Автопланета — сборка #${{ github.run_number }}
          body: |
            Автоматическая сборка build: ${{ github.run_number }}
            Ветка: ${{ github.ref_name }} (${{ github.sha }}).
            • avtoplaneta-latest-arm64.apk — для 64-битных смартфонов (~22 МБ)
            • avtoplaneta-latest-armv7.apk — для 32-битных смартфонов (~20 МБ)
            • avtoplaneta-latest.apk — основной arm64 файл
          make_latest: "true"
