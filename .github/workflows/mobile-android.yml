name: Build Android app

on:
  push:
    branches:
      - OptimizedBackend
      - main
    tags:
      - "v*"
    paths:
      - "AvtoplanetaApp/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    branches:
      - OptimizedBackend
      - main
    paths:
      - "AvtoplanetaApp/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: AvtoplanetaApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: AvtoplanetaApp

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

  build:
    name: Build APK
    needs: quality
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 30

    defaults:
      run:
        working-directory: AvtoplanetaApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: AvtoplanetaApp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: >-
          sdkmanager
          "platform-tools"
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;27.0.12077973"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: >-
          taskset --cpu-list 0-15
          flutter build apk --release --no-pub
          --build-number="${{ github.run_number }}"

      - name: Prepare release asset
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p release
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            cp build/app/outputs/flutter-apk/app-release.apk "release/avtoplaneta-${GITHUB_REF_NAME}.apk"
          else
            cp build/app/outputs/flutter-apk/app-release.apk "release/avtoplaneta-latest.apk"
          fi

      - name: Publish tag release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release/avtoplaneta-*.apk
          name: Автопланета ${{ github.ref_name }}
          generate_release_notes: true

      - name: Publish latest mobile release
        if: >-
          github.event_name == 'push' &&
          !startsWith(github.ref, 'refs/tags/') &&
          (github.ref_name == github.event.repository.default_branch || github.ref_name == 'OptimizedBackend')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: mobile-latest
          target_commitish: ${{ github.sha }}
          files: release/avtoplaneta-latest.apk
          name: Автопланета — актуальная Android-сборка
          body: Автоматическая сборка из ${{ github.ref_name }} (${{ github.sha }}).
          make_latest: "true"
