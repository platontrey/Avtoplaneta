name: Build Android app

on:
  push:
    branches:
      - OptimizedBackend
      - main
    tags:
      - "v*"
    paths:
      - "AvtoplanetaApp/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    branches:
      - OptimizedBackend
      - main
    paths:
      - "AvtoplanetaApp/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: AvtoplanetaApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: AvtoplanetaApp

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: AvtoplanetaApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: AvtoplanetaApp

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            AvtoplanetaApp/android/**/*.gradle*
            AvtoplanetaApp/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-pub --build-number="${{ github.run_number }}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: avtoplaneta-android-${{ github.sha }}
          path: AvtoplanetaApp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish APK
    if: github.event_name == 'push'
    needs:
      - quality
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: avtoplaneta-android-${{ github.sha }}
          path: release

      - name: Prepare release APK
        id: prepare-release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_asset="release/avtoplaneta-${GITHUB_REF_NAME}.apk"
          else
            release_asset="release/avtoplaneta-latest.apk"
          fi

          cp release/app-release.apk "${release_asset}"
          echo "release_asset=${release_asset}" >> "${GITHUB_OUTPUT}"

      - name: Add APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_asset="${{ steps.prepare-release.outputs.release_asset }}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${release_asset}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${release_asset}" \
              --title "Автопланета ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Update latest Android release
        if: >-
          !startsWith(github.ref, 'refs/tags/') &&
          github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="mobile-latest"
          release_asset="${{ steps.prepare-release.outputs.release_asset }}"
          release_title="Автопланета — актуальная Android-сборка"
          release_notes="Автоматическая сборка из ${GITHUB_REF_NAME} (${GITHUB_SHA})."

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
            gh release upload "${release_tag}" "${release_asset}" --clobber
            gh release edit "${release_tag}" \
              --title "${release_title}" \
              --notes "${release_notes}" \
              --latest
          else
            gh release create "${release_tag}" "${release_asset}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes "${release_notes}" \
              --latest
          fi
