name: Build Android app

on:
  push:
    branches:
      - OptimizedBackend
      - main
    tags:
      - "v*"
    paths:
      - "AvtoplanetaApp/**"
  pull_request:
    branches:
      - OptimizedBackend
      - main
    paths:
      - "AvtoplanetaApp/**"

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: AvtoplanetaApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            AvtoplanetaApp/android/**/*.gradle*
            AvtoplanetaApp/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: avtoplaneta-android-${{ github.sha }}
          path: AvtoplanetaApp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          cp build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/flutter-apk/avtoplaneta-${{ github.ref_name }}.apk

      - name: Add APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "build/app/outputs/flutter-apk/avtoplaneta-${{ github.ref_name }}.apk"
          --title "Автопланета ${{ github.ref_name }}"
          --generate-notes
