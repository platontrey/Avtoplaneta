name: Build Android app

on:
  push:
    branches:
      - OptimizedBackend
      - main
    tags:
      - "v*"
    paths:
      - "AvtoplanetaApp/**"
  pull_request:
    branches:
      - OptimizedBackend
      - main
    paths:
      - "AvtoplanetaApp/**"

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: AvtoplanetaApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: AvtoplanetaApp

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
          pub-cache: true

      - name: Restore Flutter build cache
        uses: actions/cache@v5
        with:
          path: |
            AvtoplanetaApp/.dart_tool
            AvtoplanetaApp/build
          key: flutter-android-${{ runner.os }}-3.41.6-${{ hashFiles('AvtoplanetaApp/pubspec.lock', 'AvtoplanetaApp/android/**/*.gradle*', 'AvtoplanetaApp/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: flutter-android-${{ runner.os }}-3.41.6-${{ hashFiles('AvtoplanetaApp/pubspec.lock', 'AvtoplanetaApp/android/**/*.gradle*', 'AvtoplanetaApp/android/gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number="${{ github.run_number }}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: avtoplaneta-android-${{ github.sha }}
          path: AvtoplanetaApp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Prepare release APK
        if: github.event_name == 'push'
        id: prepare-release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_asset="build/app/outputs/flutter-apk/avtoplaneta-${GITHUB_REF_NAME}.apk"
          else
            release_asset="build/app/outputs/flutter-apk/avtoplaneta-latest.apk"
          fi

          cp build/app/outputs/flutter-apk/app-release.apk "${release_asset}"
          echo "release_asset=${release_asset}" >> "${GITHUB_OUTPUT}"

      - name: Add APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_asset="${{ steps.prepare-release.outputs.release_asset }}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${release_asset}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${release_asset}" \
              --title "Автопланета ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Update latest Android release
        if: >-
          github.event_name == 'push' &&
          !startsWith(github.ref, 'refs/tags/') &&
          github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="mobile-latest"
          release_asset="${{ steps.prepare-release.outputs.release_asset }}"
          release_title="Автопланета — актуальная Android-сборка"
          release_notes="Автоматическая сборка из ${GITHUB_REF_NAME} (${GITHUB_SHA})."

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
            gh release upload "${release_tag}" "${release_asset}" --clobber
            gh release edit "${release_tag}" \
              --title "${release_title}" \
              --notes "${release_notes}" \
              --latest
          else
            gh release create "${release_tag}" "${release_asset}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes "${release_notes}" \
              --latest
          fi
