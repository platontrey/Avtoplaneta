name: Deploy to Server

on:
  push:
    branches:
      - OptimizedBackend
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and Restart Services
        run: |
          cd /opt/avtoplaneta
          git fetch --all
          git reset --hard origin/OptimizedBackend

          # Сборка всех сервисов выполняется параллельно (ограничение памяти GOMAXPROCS=16 позволяет это делать безопасно)
          docker compose build
          docker compose up -d --remove-orphans
          docker image prune -f
