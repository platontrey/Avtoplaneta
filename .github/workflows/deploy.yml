name: Deploy to Server

on:
  push:
    branches:
      - OptimizedBackend
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Pull and Restart Services
        run: |
          rsync -av --exclude=.git ./ /opt/avtoplaneta/
          cd /opt/avtoplaneta

          # КРИТИЧНО: Сервер имеет аппаратную проблему (MCE PCIe error) при 100% нагрузке на все 80 потоков.
          # Сборка ДОЛЖНА выполняться строго по очереди, иначе происходит аппаратная перезагрузка.
          docker compose build auth-service
          docker compose build parts-service
          docker compose build orders-service
          docker compose build messaging-service
          docker compose build gateway
          docker compose build frontend
          docker compose up -d --remove-orphans
          docker image prune -f
