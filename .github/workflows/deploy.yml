name: Deploy to Server

on:
  push:
    branches:
      - OptimizedBackend
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and Restart Services
        run: |
          cd /opt/avtoplaneta
          git fetch --all
          git reset --hard origin/OptimizedBackend
          # Сборка сервисов последовательно для предотвращения kernel panic и снижения нагрузки на overlayfs/CPU
          docker compose build --pull frontend
          docker compose build --pull auth-service
          docker compose build --pull parts-service
          docker compose build --pull orders-service
          docker compose build --pull messaging-service
          docker compose build --pull gateway
          docker compose up -d --remove-orphans
          docker image prune -f
