name: Deploy to Server

on:
  push:
    branches:
      - OptimizedBackend
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and Restart Services
        run: |
          cd /opt/avtoplaneta
          git fetch --all
          git reset --hard origin/OptimizedBackend

          # BuildKit включён: с узким build context (.dockerignore отсекает ~430M
          # скомпилированных бинарников) и достаточным объёмом памяти (128G) он безопасен
          # и даёт параллелизм + инкрементальный кэш слоёв.
          # Одна команда build вместо шести раздельных — кэш и base images переиспользуются.
          docker compose build frontend auth-service parts-service orders-service messaging-service gateway
          docker compose up -d --remove-orphans
          docker image prune -f
