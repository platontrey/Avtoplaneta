name: Deploy to Server

on:
  push:
    branches:
      - OptimizedBackend
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and Restart Services
        run: |
          cd /opt/avtoplaneta
          git fetch --all
          git reset --hard origin/OptimizedBackend

          # Разделили сборку на последовательные шаги, чтобы избежать нехватки памяти (OOM) и перезагрузок сервера
          docker compose build auth-service
          docker compose build parts-service
          docker compose build orders-service
          docker compose build messaging-service
          docker compose build gateway
          docker compose build frontend
          docker compose up -d --remove-orphans
          docker image prune -f
