name: Deploy to Server

on:
  push:
    branches:
      - OptimizedBackend
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and Restart Services
        run: |
          cd /opt/avtoplaneta
          git fetch --all
          git reset --hard origin/OptimizedBackend
          docker compose build --pull
          docker compose up -d --remove-orphans
          docker image prune -f
