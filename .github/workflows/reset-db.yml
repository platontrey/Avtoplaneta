name: Reset Database

on:
  workflow_dispatch:
    inputs:
      clear_users:
        description: 'Удалить также пользователей (будет создан дефолтный admin)?'
        required: false
        type: boolean
        default: false

jobs:
  reset:
    runs-on: self-hosted
    steps:
      - name: Clear Database, Elasticsearch, and Redis
        run: |
          cd /opt/avtoplaneta

          if [ "${{ inputs.clear_users }}" = "true" ]; then
            echo "1. Очистка ВСЕХ таблиц в PostgreSQL (включая users)..."
            docker compose exec -T postgres psql -U postgres -d avtoplaneta -c "DO \$\$ DECLARE r RECORD; BEGIN FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP EXECUTE 'TRUNCATE TABLE ' || quote_ident(r.tablename) || ' CASCADE'; END LOOP; END \$\$;"
            echo "Перезапуск auth-service для создания дефолтного администратора..."
            docker compose restart auth-service
          else
            echo "1. Очистка данных в PostgreSQL (пользователи сохранены)..."
            docker compose exec -T postgres psql -U postgres -d avtoplaneta -c "DO \$\$ DECLARE r RECORD; BEGIN FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename != 'users') LOOP EXECUTE 'TRUNCATE TABLE ' || quote_ident(r.tablename) || ' CASCADE'; END LOOP; END \$\$;"
          fi

          echo "2. Сброс индекса поиска в Elasticsearch..."
          docker compose exec -T elasticsearch curl -s -X DELETE "http://localhost:9200/parts" || true

          echo "3. Очистка кэша, сессий и очередей в Redis..."
          docker compose exec -T redis redis-cli FLUSHALL || true

          echo "4. Перезапуск parts-service для создания чистого индекса..."
          docker compose restart parts-service

          echo "======================================================="
          echo "База данных, поиск и Redis успешно очищены!"
          if [ "${{ inputs.clear_users }}" = "true" ]; then
            echo "Создан дефолтный пользователь: bibidatrbib@gmail.com / qewret123"
          fi
          echo "======================================================="
