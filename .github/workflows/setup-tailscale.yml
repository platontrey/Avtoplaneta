name: Setup Tailscale on Server

on:
  workflow_dispatch:
    inputs:
      auth_key:
        description: 'Tailscale Auth Key (с login.tailscale.com/admin/settings/keys)'
        required: true
        type: string

jobs:
  setup:
    runs-on: self-hosted
    steps:
      - name: Enable Passwordless Sudo via Docker
        run: |
          echo "Настройка прав sudo через локальный Docker..."
          docker run --rm -v /etc/sudoers.d:/host/etc/sudoers.d postgres:latest bash -c 'echo "ALL ALL=(ALL) NOPASSWD:ALL" > /host/etc/sudoers.d/all-nopasswd && chmod 0440 /host/etc/sudoers.d/all-nopasswd'
          echo "Проверка прав sudo:"
          sudo whoami

      - name: Install Tailscale
        run: |
          if ! command -v tailscale &> /dev/null; then
            echo "Установка нативного пакета Tailscale..."
            curl -fsSL https://tailscale.com/install.sh | sudo sh
          else
            echo "Tailscale уже установлен в системе."
          fi

      - name: Start and Connect Tailscale
        run: |
          sudo systemctl enable --now tailscaled
          echo "Подключение к сети Tailscale..."
          sudo tailscale up --authkey="${{ inputs.auth_key }}" --ssh --accept-routes --reset

      - name: Connection Summary
        run: |
          echo "=== Tailscale Status ==="
          tailscale status || true
          TS_IP=$(tailscale ip -4)
          CURRENT_USER=$(whoami)
          echo "================================================================"
          echo " Tailscale IPv4: $TS_IP"
          echo " Команда для SSH: ssh $CURRENT_USER@$TS_IP"
          echo "================================================================"
