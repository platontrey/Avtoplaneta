name: Setup Tailscale on Server

on:
  workflow_dispatch:
    inputs:
      auth_key:
        description: 'Tailscale Auth Key (получите на login.tailscale.com/admin/settings/keys)'
        required: true
        type: string
      hostname:
        description: 'Имя сервера в сети Tailscale'
        required: false
        type: string
        default: 'avtoplaneta-server'

jobs:
  setup-tailscale:
    runs-on: self-hosted
    steps:
      - name: Deploy Tailscale via Docker
        run: |
          echo "Проверка доступности Docker..."
          docker info > /dev/null

          echo "Остановка предыдущего контейнера (если есть)..."
          docker rm -f tailscale 2>/dev/null || true

          echo "Запуск Tailscale в Docker (host network mode)..."
          docker run -d \
            --name=tailscale \
            --restart=unless-stopped \
            --network=host \
            --cap-add=NET_ADMIN \
            --cap-add=NET_RAW \
            --device=/dev/net/tun:/dev/net/tun \
            -v tailscale-state:/var/lib/tailscale \
            -e TS_AUTHKEY="${{ inputs.auth_key }}" \
            -e TS_HOSTNAME="${{ inputs.hostname }}" \
            -e TS_EXTRA_ARGS="--ssh --accept-routes" \
            -e TS_STATE_DIR=/var/lib/tailscale \
            tailscale/tailscale:latest

          echo "Ожидание инициализации (5 секунд)..."
          sleep 5

      - name: Verify Tailscale Connection
        run: |
          echo "=== Логи контейнера ==="
          docker logs tailscale --tail 20

          echo "=== Статус Tailscale ==="
          docker exec tailscale tailscale status || true

          echo "================================================================"
          echo "=== IPv4 адрес сервера в сети Tailscale: ==="
          docker exec tailscale tailscale ip -4
          echo "================================================================"
