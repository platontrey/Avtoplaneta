name: Setup Tailscale on Server

on:
  workflow_dispatch:
    inputs:
      auth_key:
        description: 'Tailscale Auth Key (с login.tailscale.com/admin/settings/keys)'
        required: true
        type: string
      sudo_password:
        description: 'Sudo пароль пользователя'
        required: false
        type: string
        default: 'qewret123'

jobs:
  setup:
    runs-on: self-hosted
    steps:
      - name: Configure Passwordless Sudo
        run: |
          echo "${{ inputs.sudo_password }}" | sudo -S -k sh -c 'echo "Avtoplaneta ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/avtoplaneta-nopasswd && chmod 0440 /etc/sudoers.d/avtoplaneta-nopasswd'
          echo "Беспарольный sudo успешно настроен для пользователя Avtoplaneta!"

      - name: Install Tailscale
        run: |
          if ! command -v tailscale &> /dev/null; then
            echo "Установка нативного пакета Tailscale..."
            curl -fsSL https://tailscale.com/install.sh | sh
          else
            echo "Tailscale уже установлен."
          fi

      - name: Connect to Tailscale
        run: |
          sudo systemctl enable --now tailscaled
          echo "Подключение к сети Tailscale..."
          sudo tailscale up --authkey="${{ inputs.auth_key }}" --ssh --accept-routes --reset

      - name: Connection Summary
        run: |
          echo "=== Tailscale Status ==="
          tailscale status || true
          TS_IP=$(tailscale ip -4)
          echo "================================================================"
          echo " Tailscale IPv4: $TS_IP"
          echo " Команда для SSH: ssh Avtoplaneta@$TS_IP"
          echo "================================================================"
