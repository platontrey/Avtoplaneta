global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8080']

  - job_name: 'messaging-service'
    static_configs:
      - targets: ['messaging-service:8084']

  - job_name: 'parts-service'
    static_configs:
      - targets: ['parts-service:8081']

  - job_name: 'orders-service'
    static_configs:
      - targets: ['orders-service:8082']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8083']
