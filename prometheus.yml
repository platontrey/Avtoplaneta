global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['localhost:8080']

  - job_name: 'messaging-service'
    static_configs:
      - targets: ['localhost:8084']

  - job_name: 'parts-service'
    static_configs:
      - targets: ['localhost:8081']

  - job_name: 'orders-service'
    static_configs:
      - targets: ['localhost:8082']