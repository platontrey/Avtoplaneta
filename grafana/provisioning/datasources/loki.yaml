apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
          name: TraceID
          url: '$${__value.raw}'
          urlDisplayLabel: 'Посмотреть трейс в Tempo'
