<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Автопланета</title>
    <script>
      (function() {
        try {
          var key = 'avtoplaneta-theme';
          var stored = localStorage.getItem(key);
          var supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && supportDark) || (stored === 'system' && supportDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Защита от сбоев загрузки ассетов и устаревших чанков Service Worker после новых деплоев
      window.addEventListener('error', function(e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var src = e.target.src || e.target.href || '';
          if (src.indexOf('/assets/') !== -1) {
            var retryKey = 'avtoplaneta_asset_retry';
            if (!sessionStorage.getItem(retryKey)) {
              sessionStorage.setItem(retryKey, '1');
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) regs[i].unregister();
                });
              }
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  for (var i = 0; i < names.length; i++) caches.delete(names[i]);
                });
              }
              window.location.reload();
            }
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Define siteDubbingRules to prevent undefined errors from extensions
      window.siteDubbingRules = {};
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
