name: avtoplaneta_app
description: "Avtoplaneta — система управления автозапчастями"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # HTTP клиент
  dio: ^5.8.0
  pretty_dio_logger: ^1.4.0

  # Состояние
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Навигация
  go_router: ^15.1.2

  # Безопасное хранение токенов
  flutter_secure_storage: ^9.2.4

  # Изображения
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Чарты (статистика)
  fl_chart: ^0.71.0

  # UI компоненты
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0

  # Утилиты
  intl: ^0.20.2
  timeago: ^3.7.0
  google_sign_in: ^7.2.0
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  image_cropper: ^12.2.1
  crypto: ^3.0.7
  hive_flutter: ^1.1.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0

  # Автообновление (In-App APK Updates)
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

# path_provider_android 2.3.x compiles a JNI bridge through CMake on every
# Android CI build. Keep the stable channel implementation until that native
# build can be cached efficiently by Flutter tooling.
dependency_overrides:
  path_provider_android: 2.2.23
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
