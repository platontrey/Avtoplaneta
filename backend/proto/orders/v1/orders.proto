syntax = "proto3";
package orders.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "avtoplaneta/gen/orders/v1;ordersv1";

service OrdersService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrders(GetOrdersRequest) returns (GetOrdersResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
  rpc CompleteOrder(CompleteOrderRequest) returns (CompleteOrderResponse);
  rpc DeleteOrder(DeleteOrderRequest) returns (DeleteOrderResponse);
  rpc AddOrderItem(AddOrderItemRequest) returns (AddOrderItemResponse);
  rpc GetMonthlySales(GetMonthlySalesRequest) returns (GetMonthlySalesResponse);
}

// ─── Order Model ────────────────────────────────────────────────────────────

message OrderItem {
  int64 id = 1;
  int64 order_id = 2;
  int64 part_id = 3;
  int32 quantity = 4;
  double price = 5;
}

message Order {
  int64 id = 1;
  int64 customer_id = 2;
  int64 seller_id = 3;
  string seller = 4;
  string part = 5;
  int64 part_id = 6;
  string location = 7;
  string buyer_number = 8;
  string status = 9;
  string status_text = 10;
  bool auto_deleted = 11;
  google.protobuf.Timestamp created_at = 12;
  string created_at_formatted = 13;
  string time_ago = 14;
  repeated OrderItem items = 15;
}

// ─── Requests and Responses ────────────────────────────────────────────────

message CreateOrderItemInput {
  int64 part_id = 1 [(buf.validate.field).int64.gt = 0];
  int32 quantity = 2 [(buf.validate.field).int32.gt = 0];
}

message CreateOrderRequest {
  int64 customer_id = 1 [(buf.validate.field).int64.gt = 0];
  string part = 2 [(buf.validate.field).string.min_len = 1];
  int64 part_id = 3 [(buf.validate.field).int64.gt = 0];
  string buyer_number = 4;
  int64 seller_id = 5 [(buf.validate.field).int64.gt = 0];
  repeated CreateOrderItemInput items = 6;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrdersRequest {
  // Фильтры
  string status = 1;
  int64 seller_id = 2;
  int32 limit = 3;
  int32 offset = 4;
  bool admin = 5; // если true — возвращает все заказы
}

message GetOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
}

message UpdateOrderStatusRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string status = 2 [(buf.validate.field).string.min_len = 1];
}

message UpdateOrderStatusResponse {
  Order order = 1;
}

message CompleteOrderRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message CompleteOrderResponse {
  Order order = 1;
}

message DeleteOrderRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteOrderResponse {}

message AddOrderItemRequest {
  int64 order_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 part_id = 2 [(buf.validate.field).int64.gt = 0];
  int32 quantity = 3 [(buf.validate.field).int32.gt = 0];
}

message AddOrderItemResponse {
  Order order = 1;
}

// ─── Monthly Sales ──────────────────────────────────────────────────────────

message GetMonthlySalesRequest {}

message MonthlySalesEntry {
  string month = 1;
  double sales = 2;
}

message GetMonthlySalesResponse {
  repeated MonthlySalesEntry entries = 1;
}
