syntax = "proto3";
package auth.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "avtoplaneta/gen/auth/v1;authv1";

service AuthService {
  // Валидация сессии — горячий путь, вызывается на каждый защищённый запрос
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/validate"
      body: "*"
    };
  }

  // CRUD пользователей
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{id}"
      response_body: "user"
    };
  }

  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse) {
    option (google.api.http) = {get: "/api/v1/users"};
  }

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users"
      body: "*"
      response_body: "user"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      put: "/api/v1/users/{id}"
      body: "*"
      response_body: "user"
    };
  }

  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {delete: "/api/v1/users/{id}"};
  }

  // Активность
  rpc LogActivity(LogActivityRequest) returns (LogActivityResponse) {
    option (google.api.http) = {
      post: "/api/v1/activity"
      body: "*"
    };
  }

  rpc GetActivityLogs(GetActivityLogsRequest) returns (GetActivityLogsResponse) {
    option (google.api.http) = {get: "/api/v1/activity"};
  }

  // Админ
  rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse) {
    option (google.api.http) = {get: "/api/v1/admin/status"};
  }

  rpc GetServerLogs(GetServerLogsRequest) returns (GetServerLogsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/logs"};
  }
}

// ─── Auth ───────────────────────────────────────────────────────────────────

message ValidateSessionRequest {
  string session_cookie = 1;
  string authorization = 2;
}

message ValidateSessionResponse {
  bool valid = 1;
  User user = 2;
}

// ─── User ───────────────────────────────────────────────────────────────────

message User {
  int64 id = 1;
  string email = 2;
  string name = 3;
  string role = 4;
  string initials = 5;
  string inn = 6;
  string provider = 7;
  string username = 8;
  string avatar_url = 9;
}

message GetUserRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetUserResponse {
  User user = 1;
}

message GetUsersRequest {
  // пустой — возвращает всех
}

message GetUsersResponse {
  repeated User users = 1;
}

message CreateUserRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string password = 3 [(buf.validate.field).string.min_len = 6];
  string role = 4;
  string initials = 5;
  string inn = 6;
  string username = 7;
  string avatar_url = 8;
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string name = 2;
  string email = 3;
  string role = 4;
  string initials = 5;
  string inn = 6;
  string username = 7;
  string avatar_url = 8;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteUserResponse {}

// ─── Activity Logs ──────────────────────────────────────────────────────────

message LogActivityRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
  string user_name = 2;
  string user_email = 3;
  string action = 4 [(buf.validate.field).string.min_len = 1];
  string resource_type = 5;
  int64 resource_id = 6;
  string details = 7;
  string ip_address = 8;
  string user_agent = 9;
}

message LogActivityResponse {}

message GetActivityLogsRequest {
  int64 user_id = 1;
  string action = 2;
  string resource_type = 3;
  google.protobuf.Timestamp start_date = 4;
  google.protobuf.Timestamp end_date = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message ActivityLog {
  int64 id = 1;
  int64 user_id = 2;
  string user_name = 3;
  string user_email = 4;
  string action = 5;
  string resource_type = 6;
  int64 resource_id = 7;
  string details = 8;
  string ip_address = 9;
  string user_agent = 10;
  google.protobuf.Timestamp created_at = 11;
}

message GetActivityLogsResponse {
  repeated ActivityLog logs = 1;
  int32 total = 2;
}

// ─── Server Status ──────────────────────────────────────────────────────────

message GetServerStatusRequest {}

message GetServerStatusResponse {
  string status = 1;
  int64 uptime_seconds = 2;
  int32 total_users = 3;
  int32 active_sessions = 4;
  double memory_usage_mb = 5;
  int32 goroutines = 6;
  int32 total_parts = 7;
}

message GetServerLogsRequest {
  int32 limit = 1;
  string level = 2;
}

message ServerLog {
  string timestamp = 1;
  string level = 2;
  string message = 3;
  string source = 4;
}

message GetServerLogsResponse {
  repeated ServerLog logs = 1;
}
