syntax = "proto3";
package messaging.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "avtoplaneta/gen/messaging/v1;messagingv1";

service MessagingService {
  // Conversations
  rpc GetConversations(GetConversationsRequest) returns (GetConversationsResponse);
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc UpdateConversation(UpdateConversationRequest) returns (UpdateConversationResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
  rpc RemoveParticipant(RemoveParticipantRequest) returns (RemoveParticipantResponse);

  // Messages
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc SendVoiceMessage(stream SendVoiceMessageRequest) returns (SendVoiceMessageResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  rpc MarkMessageRead(MarkMessageReadRequest) returns (MarkMessageReadResponse);

  // Reactions
  rpc AddReaction(AddReactionRequest) returns (AddReactionResponse);
  rpc RemoveReaction(RemoveReactionRequest) returns (RemoveReactionResponse);

  // Notifications
  rpc GetNotifications(GetNotificationsRequest) returns (GetNotificationsResponse);
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse);
  rpc MarkAllNotificationsRead(MarkAllNotificationsReadRequest) returns (MarkAllNotificationsReadResponse);

  // User Status
  rpc GetUserStatuses(GetUserStatusesRequest) returns (GetUserStatusesResponse);
  rpc UpdateUserStatus(UpdateUserStatusRequest) returns (UpdateUserStatusResponse);

  // Search
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);

  // Drom Integration
  rpc GetDromDialogs(GetDromDialogsRequest) returns (GetDromDialogsResponse);
  rpc GetDromMessages(GetDromMessagesRequest) returns (GetDromMessagesResponse);
  rpc SendDromMessage(SendDromMessageRequest) returns (SendDromMessageResponse);
}

// ─── Conversation ───────────────────────────────────────────────────────────

message Conversation {
  int64 id = 1;
  repeated int64 participants = 2;
  string title = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_message_at = 5;
  string last_message = 6;
  int32 unread_count = 7;
}

message GetConversationsRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetConversationsResponse {
  repeated Conversation conversations = 1;
}

message CreateConversationRequest {
  repeated int64 participants = 1;
  string title = 2;
}

message CreateConversationResponse {
  Conversation conversation = 1;
}

message GetConversationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetConversationResponse {
  Conversation conversation = 1;
}

message UpdateConversationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string title = 2 [(buf.validate.field).string.min_len = 1];
}

message UpdateConversationResponse {
  Conversation conversation = 1;
}

message DeleteConversationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteConversationResponse {}

message RemoveParticipantRequest {
  int64 conversation_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 user_id = 2 [(buf.validate.field).int64.gt = 0];
  int64 requester_id = 3 [(buf.validate.field).int64.gt = 0]; // кто удаляет
}

message RemoveParticipantResponse {}

// ─── Message ────────────────────────────────────────────────────────────────

message Mention {
  int64 id = 1;
  int64 message_id = 2;
  string type = 3; // "part" or "order"
  int64 resource_id = 4;
  string text = 5;
}

message Reaction {
  int64 id = 1;
  int64 message_id = 2;
  int64 user_id = 3;
  string emoji = 4;
}

message Message {
  int64 id = 1;
  int64 conversation_id = 2;
  int64 sender_id = 3;
  string content = 4;
  string message_type = 5; // "text", "voice"
  string voice_url = 6;
  google.protobuf.Timestamp created_at = 7;
  repeated int64 read_by = 8;
  repeated string attachments = 9;
  repeated Mention mentions = 10;
  repeated Reaction reactions = 11;
}

message GetMessagesRequest {
  int64 conversation_id = 1 [(buf.validate.field).int64.gt = 0];
  int32 limit = 2;
  int32 offset = 3;
}

message GetMessagesResponse {
  repeated Message messages = 1;
}

message SendMessageRequest {
  int64 conversation_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 sender_id = 2 [(buf.validate.field).int64.gt = 0];
  string content = 3 [(buf.validate.field).string.min_len = 1];
  repeated string attachments = 4;
}

message SendMessageResponse {
  Message message = 1;
}

message SendVoiceMessageRequest {
  int64 conversation_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 sender_id = 2 [(buf.validate.field).int64.gt = 0];
  string filename = 3;
  string content_type = 4;
  bytes data = 5;
}

message SendVoiceMessageResponse {
  Message message = 1;
}

message DeleteMessageRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteMessageResponse {}

message MarkMessageReadRequest {
  int64 message_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 user_id = 2 [(buf.validate.field).int64.gt = 0];
}

message MarkMessageReadResponse {}

// ─── Reactions ──────────────────────────────────────────────────────────────

message AddReactionRequest {
  int64 message_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 user_id = 2 [(buf.validate.field).int64.gt = 0];
  string emoji = 3 [(buf.validate.field).string.min_len = 1];
}

message AddReactionResponse {
  Reaction reaction = 1;
}

message RemoveReactionRequest {
  int64 reaction_id = 1 [(buf.validate.field).int64.gt = 0];
}

message RemoveReactionResponse {}

// ─── Notifications ──────────────────────────────────────────────────────────

message Notification {
  int64 id = 1;
  int64 user_id = 2;
  string type = 3; // "message", "mention", "reaction"
  string message = 4;
  bool read = 5;
  google.protobuf.Timestamp created_at = 6;
  int64 related_id = 7;
}

message GetNotificationsRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetNotificationsResponse {
  repeated Notification notifications = 1;
}

message MarkNotificationReadRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message MarkNotificationReadResponse {}

message MarkAllNotificationsReadRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
}

message MarkAllNotificationsReadResponse {}

// ─── User Status ────────────────────────────────────────────────────────────

message UserStatus {
  int64 id = 1;
  int64 user_id = 2;
  bool is_online = 3;
  google.protobuf.Timestamp last_seen = 4;
}

message GetUserStatusesRequest {
  repeated int64 user_ids = 1;
}

message GetUserStatusesResponse {
  repeated UserStatus statuses = 1;
}

message UpdateUserStatusRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
  bool is_online = 2;
}

message UpdateUserStatusResponse {
  UserStatus status = 1;
}

// ─── Search ─────────────────────────────────────────────────────────────────

message SearchMessagesRequest {
  string query = 1 [(buf.validate.field).string.min_len = 1];
  int64 user_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message SearchMessagesResponse {
  repeated Message messages = 1;
}

// ─── Drom Integration ───────────────────────────────────────────────────────

message DromDialog {
  int64 id = 1;
  string dialog_id = 2;
  string interlocutor = 3;
  string created_at = 4;
  string last_message_at = 5;
  string last_message = 6;
  bool is_unread = 7;
  string part_title = 8;
  string part_price = 9;
  string part_url = 10;
  string part_photo_url = 11;
  string bulletin_id = 12;
  string user_rating = 13;
  string user_status = 14;
}

message GetDromDialogsRequest {}

message GetDromDialogsResponse {
  repeated DromDialog dialogs = 1;
}

message DromMessage {
  int64 id = 1;
  string dialog_id = 2;
  string message_id = 3;
  string author = 4;
  string direction = 5;
  string time = 6;
  string text = 7;
  bool is_read = 8;
  string created_at = 9;
}

message GetDromMessagesRequest {
  string dialog_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetDromMessagesResponse {
  repeated DromMessage messages = 1;
  DromDialog dialog = 2;
}

message SendDromMessageRequest {
  string dialog_id = 1 [(buf.validate.field).string.min_len = 1];
  string content = 2 [(buf.validate.field).string.min_len = 1];
}

message SendDromMessageResponse {
  bool success = 1;
}
