services:
  traefik:
    image: traefik:latest
    container_name: traefik
    cpuset: "20-39,60-79"
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme.json:/etc/traefik/acme.json
      - traefik-logs:/var/log/traefik
    networks:
      - avtoplaneta_network
    labels:
      - "traefik.enable=true"
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-backend-server.ru}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: avtoplaneta-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: avtoplaneta-frontend
    cpuset: "20-39,60-79"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    labels:
      - "traefik.enable=true"
      # Cloudflare terminates public TLS; Traefik still encrypts the origin hop.
      - "traefik.http.routers.frontend.rule=Host(`${PUBLIC_DOMAIN:-backend-server.ru}`) || Host(`www.${PUBLIC_DOMAIN:-backend-server.ru}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.middlewares=compress-res@file"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Keep LAN access separate so ACME never requests a certificate for RFC1918 IPs.
      - "traefik.http.routers.frontend-lan.rule=Host(`192.168.1.3`)"
      - "traefik.http.routers.frontend-lan.entrypoints=websecure"
      - "traefik.http.routers.frontend-lan.tls=true"
      - "traefik.http.routers.frontend-lan.middlewares=compress-res@file"
      - "traefik.http.routers.frontend-lan.service=frontend"
    depends_on:
      - auth-service
      - parts-service

  auth-service:
    image: avtoplaneta-auth-service:latest
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: avtoplaneta-auth
    cpuset: "20-39,60-79"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    expose:
      - "8083"
      - "9083"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=(Host(`${PUBLIC_DOMAIN:-backend-server.ru}`) || Host(`www.${PUBLIC_DOMAIN:-backend-server.ru}`)) && (PathPrefix(`/auth`) || PathPrefix(`/admin`) || PathPrefix(`/api/users`) || PathPrefix(`/api/app`))"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls=true"
      - "traefik.http.routers.auth.middlewares=compress-res@file"
      - "traefik.http.services.auth.loadbalancer.server.port=8083"
      - "traefik.http.routers.auth-lan.rule=Host(`192.168.1.3`) && (PathPrefix(`/auth`) || PathPrefix(`/admin`) || PathPrefix(`/api/users`) || PathPrefix(`/api/app`))"
      - "traefik.http.routers.auth-lan.entrypoints=websecure"
      - "traefik.http.routers.auth-lan.tls=true"
      - "traefik.http.routers.auth-lan.middlewares=compress-res@file"
      - "traefik.http.routers.auth-lan.service=auth"
    environment:
      - NODE_ENV=production
      - PORT=8083
      - GRPC_PORT=9083
      - DATABASE_URL=${AUTH_DATABASE_URL:-${DATABASE_URL}}
      - SESSION_SECRET=${SESSION_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=https://${PUBLIC_DOMAIN:-backend-server.ru}/auth/google/callback
      - ALLOWED_ORIGINS=https://${PUBLIC_DOMAIN:-backend-server.ru},https://www.${PUBLIC_DOMAIN:-backend-server.ru},https://192.168.1.3
      - PARTS_SERVICE_URL=http://parts-service:8081
      - PARTS_GRPC_ADDR=parts-service:9081
      - REDIS_URL=redis:6379
      - GOMEMLIMIT=1024MiB
      - GOGC=400
      - GOMAXPROCS=8
    depends_on:
      - postgres
      - redis

  parts-service:
    image: avtoplaneta-parts-service:latest
    build:
      context: ./backend
      dockerfile: parts-service/Dockerfile
    container_name: avtoplaneta-parts
    cpuset: "20-39,60-79"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    volumes:
      - parts-uploads:/app/uploads
    expose:
      - "8081"
      - "9081"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.parts-public.rule=(Host(`${PUBLIC_DOMAIN:-backend-server.ru}`) || Host(`www.${PUBLIC_DOMAIN:-backend-server.ru}`)) && (PathPrefix(`/uploads`) || PathPrefix(`/api/inventory`) || PathPrefix(`/api/part-catalog`) || PathPrefix(`/api/vehicle-catalog`) || PathPrefix(`/api/statistics`))"
      - "traefik.http.routers.parts-public.entrypoints=websecure"
      - "traefik.http.routers.parts-public.tls=true"
      - "traefik.http.routers.parts-public.middlewares=compress-res@file"
      - "traefik.http.routers.parts-public.service=parts"
      - "traefik.http.routers.parts-secure.rule=(Host(`${PUBLIC_DOMAIN:-backend-server.ru}`) || Host(`www.${PUBLIC_DOMAIN:-backend-server.ru}`)) && (PathPrefix(`/api/addpart`) || PathPrefix(`/api/updatepart`) || PathPrefix(`/api/deletepart`) || PathPrefix(`/api/uploadpartphoto`) || PathPrefix(`/api/deletepartphoto`) || PathPrefix(`/api/markpartfordeletion`) || PathPrefix(`/api/defect-reports`) || PathPrefix(`/api/admin`))"
      - "traefik.http.routers.parts-secure.entrypoints=websecure"
      - "traefik.http.routers.parts-secure.tls=true"
      - "traefik.http.routers.parts-secure.middlewares=compress-res@file,auth-forward@file"
      - "traefik.http.routers.parts-secure.service=parts"
      - "traefik.http.services.parts.loadbalancer.server.port=8081"
      - "traefik.http.routers.parts-lan.rule=Host(`192.168.1.3`) && (PathPrefix(`/uploads`) || PathPrefix(`/api/inventory`) || PathPrefix(`/api/part-catalog`) || PathPrefix(`/api/vehicle-catalog`) || PathPrefix(`/api/statistics`) || PathPrefix(`/api/addpart`) || PathPrefix(`/api/updatepart`) || PathPrefix(`/api/deletepart`) || PathPrefix(`/api/uploadpartphoto`) || PathPrefix(`/api/deletepartphoto`) || PathPrefix(`/api/markpartfordeletion`) || PathPrefix(`/api/defect-reports`) || PathPrefix(`/api/admin`))"
      - "traefik.http.routers.parts-lan.entrypoints=websecure"
      - "traefik.http.routers.parts-lan.tls=true"
      - "traefik.http.routers.parts-lan.middlewares=compress-res@file"
      - "traefik.http.routers.parts-lan.service=parts"
    environment:
      - NODE_ENV=production
      - PORT=8081
      - GRPC_PORT=9081
      - DATABASE_URL=${PARTS_DATABASE_URL:-${DATABASE_URL}}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis:6379
      - AUTH_GRPC_ADDR=auth-service:9083
      - ORDERS_GRPC_ADDR=orders-service:9082
      - GOMEMLIMIT=1024MiB
      - GOGC=400
      - GOMAXPROCS=8
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  orders-service:
    image: avtoplaneta-orders-service:latest
    build:
      context: ./backend
      dockerfile: orders-service/Dockerfile
    container_name: avtoplaneta-orders
    cpuset: "20-39,60-79"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    expose:
      - "8082"
      - "9082"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orders.rule=(Host(`${PUBLIC_DOMAIN:-backend-server.ru}`) || Host(`www.${PUBLIC_DOMAIN:-backend-server.ru}`)) && (PathPrefix(`/orders`) || PathPrefix(`/admin/orders`) || PathPrefix(`/api/orders`))"
      - "traefik.http.routers.orders.entrypoints=websecure"
      - "traefik.http.routers.orders.tls=true"
      - "traefik.http.routers.orders.middlewares=compress-res@file,auth-forward@file"
      - "traefik.http.services.orders.loadbalancer.server.port=8082"
      - "traefik.http.routers.orders-lan.rule=Host(`192.168.1.3`) && (PathPrefix(`/orders`) || PathPrefix(`/admin/orders`) || PathPrefix(`/api/orders`))"
      - "traefik.http.routers.orders-lan.entrypoints=websecure"
      - "traefik.http.routers.orders-lan.tls=true"
      - "traefik.http.routers.orders-lan.middlewares=compress-res@file"
      - "traefik.http.routers.orders-lan.service=orders"
    environment:
      - NODE_ENV=production
      - PORT=8082
      - GRPC_PORT=9082
      - DATABASE_URL=${ORDERS_DATABASE_URL:-${DATABASE_URL}}
      - SESSION_SECRET=${SESSION_SECRET}
      - REDIS_URL=redis:6379
      - AUTH_SERVICE_URL=http://auth-service:8083
      - AUTH_GRPC_ADDR=auth-service:9083
      - PARTS_SERVICE_GRPC_URL=parts-service:9081
      - GOMEMLIMIT=1024MiB
      - GOGC=400
      - GOMAXPROCS=8
    depends_on:
      - postgres
      - redis
      - parts-service

  export-service:
    image: avtoplaneta-export-service:latest
    build:
      context: ./backend
      dockerfile: export-service/Dockerfile
    container_name: avtoplaneta-export
    cpuset: "20-39,60-79"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    volumes:
      - export-uploads:/app/uploads
    expose:
      - "8085"
    labels:
      - "traefik.enable=true"
      # Публичный прайс-лист XML
      - "traefik.http.routers.export-pricelist.rule=(Host(`${PUBLIC_DOMAIN:-backend-server.ru}`) || Host(`www.${PUBLIC_DOMAIN:-backend-server.ru}`)) && Path(`/uploads/pricelist.xml`)"
      - "traefik.http.routers.export-pricelist.priority=100"
      - "traefik.http.routers.export-pricelist.entrypoints=websecure"
      - "traefik.http.routers.export-pricelist.tls=true"
      - "traefik.http.routers.export-pricelist.service=export"
      # Защищенные админские эндпоинты генерации
      - "traefik.http.routers.export.rule=(Host(`${PUBLIC_DOMAIN:-backend-server.ru}`) || Host(`www.${PUBLIC_DOMAIN:-backend-server.ru}`)) && PathPrefix(`/api/export`)"
      - "traefik.http.routers.export.entrypoints=websecure"
      - "traefik.http.routers.export.tls=true"
      - "traefik.http.routers.export.middlewares=compress-res@file,auth-forward-admin@file"
      - "traefik.http.services.export.loadbalancer.server.port=8085"
    environment:
      - NODE_ENV=production
      - PORT=8085
      - PARTS_SERVICE_GRPC_URL=parts-service:9081
      - AUTH_SERVICE_GRPC_URL=auth-service:9083
      - EXPORT_DIR=/app/uploads
      - DROM_API_KEY=${DROM_API_KEY}
      - DROM_PACKET_ID=${DROM_PACKET_ID}
      - GOMEMLIMIT=512MiB
      - GOGC=400
      - GOMAXPROCS=4
    depends_on:
      - parts-service
      - auth-service

  messaging-service:
    image: avtoplaneta-messaging-service:latest
    build:
      context: ./backend
      dockerfile: messaging-service/Dockerfile
    container_name: avtoplaneta-messaging
    cpuset: "20-39,60-79"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    volumes:
      - messaging-uploads:/app/uploads
    expose:
      - "8084"
      - "9084"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.messaging.rule=(Host(`${PUBLIC_DOMAIN:-backend-server.ru}`) || Host(`www.${PUBLIC_DOMAIN:-backend-server.ru}`)) && PathPrefix(`/api/messaging`)"
      - "traefik.http.routers.messaging.entrypoints=websecure"
      - "traefik.http.routers.messaging.tls=true"
      - "traefik.http.routers.messaging.middlewares=compress-res@file,auth-forward@file"
      - "traefik.http.services.messaging.loadbalancer.server.port=8084"
      - "traefik.http.routers.messaging-lan.rule=Host(`192.168.1.3`) && PathPrefix(`/api/messaging`)"
      - "traefik.http.routers.messaging-lan.entrypoints=websecure"
      - "traefik.http.routers.messaging-lan.tls=true"
      - "traefik.http.routers.messaging-lan.middlewares=compress-res@file"
      - "traefik.http.routers.messaging-lan.service=messaging"
    environment:
      - NODE_ENV=production
      - PORT=8084
      - GRPC_PORT=9084
      - DATABASE_URL=${MESSAGING_DATABASE_URL:-${DATABASE_URL}}
      - REDIS_URL=redis:6379
      - AUTH_SERVICE_URL=http://auth-service:8083
      - AUTH_GRPC_ADDR=auth-service:9083
      - DROM_API_KEY=${DROM_API_KEY}
      - DROM_PACKET_ID=${DROM_PACKET_ID}
      - MESSAGING_SERVICE_URL=https://${PUBLIC_DOMAIN:-backend-server.ru}/api/messaging
      - GOMEMLIMIT=1024MiB
      - GOGC=400
      - GOMAXPROCS=8
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:latest
    container_name: avtoplaneta-postgres
    cpuset: "0-19,40-59"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-avtoplaneta}
      - POSTGRES_MULTIPLE_DATABASES=avtoplaneta_auth,avtoplaneta_parts,avtoplaneta_orders,avtoplaneta_messaging
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=12GB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "min_wal_size=2GB"
      - "-c"
      - "max_wal_size=8GB"
      - "-c"
      - "max_worker_processes=16"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_workers=16"
      - "-c"
      - "max_parallel_maintenance_workers=2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: avtoplaneta-redis
    cpuset: "0-19,40-59"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:9.3.3
    container_name: avtoplaneta-elasticsearch
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    expose:
      - "9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: avtoplaneta-prometheus
    cpuset: "20-39,60-79"
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - avtoplaneta_network
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  node-exporter:
    image: prom/node-exporter:latest
    container_name: avtoplaneta-node-exporter
    restart: unless-stopped
    pid: host
    networks:
      - avtoplaneta_network
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: avtoplaneta-cadvisor
    restart: unless-stopped
    privileged: true
    networks:
      - avtoplaneta_network
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  grafana:
    image: grafana/grafana:latest
    container_name: avtoplaneta-grafana
    cpuset: "20-39,60-79"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - avtoplaneta_network
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}

  tempo:
    image: grafana/tempo:latest
    container_name: avtoplaneta-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    expose:
      - "14268"  # jaeger ingest
      - "3200"   # tempo
      - "4317"   # otlp grpc
      - "4318"   # otlp http
      - "9411"   # zipkin
    networks:
      - avtoplaneta_network
    restart: unless-stopped

networks:
  avtoplaneta_network:
    driver: bridge

volumes:
  traefik-logs:
  postgres-data:
  redis-data:
  parts-uploads:
  messaging-uploads:
  export-uploads:
  prometheus-data:
  grafana-data:
  tempo-data:
