services:
  traefik:
    image: traefik:latest
    container_name: traefik
    cpuset: "20-39,60-79"
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme.json:/etc/traefik/acme.json
      - traefik-logs:/var/log/traefik
    networks:
      - avtoplaneta_network
    labels:
      - "traefik.enable=true"
      # Global HTTP to HTTPS redirect
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - DOMAIN=${DOMAIN:-localhost}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: avtoplaneta-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: avtoplaneta-frontend
    cpuset: "20-39,60-79"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    depends_on:
      - gateway

  gateway:
    image: avtoplaneta-gateway:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avtoplaneta-gateway
    cpuset: "20-39,60-79"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/admin`) || PathPrefix(`/orders`) || PathPrefix(`/uploads`) || PathPrefix(`/health`) || PathPrefix(`/ready`) || PathPrefix(`/metrics`) || PathPrefix(`/swagger`))"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls=true"
      - "traefik.http.routers.gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
    environment:
      - NODE_ENV=production
      - DOMAIN=${DOMAIN}
      - AUTH_SERVICE_URL=http://auth-service:8083
      - PARTS_SERVICE_URL=http://parts-service:8081
      - ORDERS_SERVICE_URL=http://orders-service:8082
      - MESSAGING_SERVICE_URL=http://messaging-service:8084
      - AUTH_GRPC_ADDR=auth-service:9083
      - PARTS_GRPC_ADDR=parts-service:9081
      - SESSION_SECRET=${SESSION_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - FORWARDED_ALLOW_IPS=*
      - GOMEMLIMIT=1024MiB
      - GOGC=400
      - GOMAXPROCS=8
    depends_on:
      - auth-service
      - parts-service
      - orders-service
      - messaging-service
      - postgres
      - redis

  auth-service:
    image: avtoplaneta-auth-service:latest
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: avtoplaneta-auth
    cpuset: "20-39,60-79"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    expose:
      - "8083"
      - "9083"
    environment:
      - NODE_ENV=production
      - PORT=8083
      - GRPC_PORT=9083
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=https://${DOMAIN}/auth/google/callback
      - ALLOWED_ORIGINS=https://${DOMAIN},http://${DOMAIN}
      - PARTS_SERVICE_URL=http://parts-service:8081
      - GOMEMLIMIT=1024MiB
      - GOGC=400
      - GOMAXPROCS=8
    depends_on:
      - postgres
      - redis

  parts-service:
    image: avtoplaneta-parts-service:latest
    build:
      context: ./backend
      dockerfile: parts-service/Dockerfile
    container_name: avtoplaneta-parts
    cpuset: "20-39,60-79"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    volumes:
      - parts-uploads:/app/uploads
    expose:
      - "8081"
      - "9081"
    environment:
      - NODE_ENV=production
      - PORT=8081
      - GRPC_PORT=9081
      - DATABASE_URL=${DATABASE_URL}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis:6379
      - AUTH_GRPC_ADDR=auth-service:9083
      - ORDERS_GRPC_ADDR=orders-service:9082
      - GOMEMLIMIT=1024MiB
      - GOGC=400
      - GOMAXPROCS=8
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  orders-service:
    image: avtoplaneta-orders-service:latest
    build:
      context: ./backend
      dockerfile: orders-service/Dockerfile
    container_name: avtoplaneta-orders
    cpuset: "20-39,60-79"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    expose:
      - "8082"
      - "9082"
    environment:
      - NODE_ENV=production
      - PORT=8082
      - GRPC_PORT=9082
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - REDIS_URL=redis:6379
      - AUTH_SERVICE_URL=http://auth-service:8083
      - PARTS_SERVICE_GRPC_URL=parts-service:9081
      - GOMEMLIMIT=1024MiB
      - GOGC=400
      - GOMAXPROCS=8
    depends_on:
      - postgres
      - redis
      - parts-service

  messaging-service:
    image: avtoplaneta-messaging-service:latest
    build:
      context: ./backend
      dockerfile: messaging-service/Dockerfile
    container_name: avtoplaneta-messaging
    cpuset: "20-39,60-79"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    volumes:
      - messaging-uploads:/app/uploads
    expose:
      - "8084"
      - "9084"
    environment:
      - NODE_ENV=production
      - PORT=8084
      - GRPC_PORT=9084
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis:6379
      - GATEWAY_URL=http://gateway:8080
      - DROM_API_KEY=${DROM_API_KEY}
      - DROM_PACKET_ID=${DROM_PACKET_ID}
      - MESSAGING_SERVICE_URL=https://${DOMAIN}/api/messaging
      - GOMEMLIMIT=1024MiB
      - GOGC=400
      - GOMAXPROCS=8
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:latest
    container_name: avtoplaneta-postgres
    cpuset: "0-19,40-59"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-avtoplaneta}
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=12GB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "min_wal_size=2GB"
      - "-c"
      - "max_wal_size=8GB"
      - "-c"
      - "max_worker_processes=16"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_workers=16"
      - "-c"
      - "max_parallel_maintenance_workers=2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: avtoplaneta-redis
    cpuset: "0-19,40-59"
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:9.3.3
    container_name: avtoplaneta-elasticsearch
    restart: unless-stopped
    networks:
      - avtoplaneta_network
    expose:
      - "9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: avtoplaneta-prometheus
    cpuset: "20-39,60-79"
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - avtoplaneta_network
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  node-exporter:
    image: prom/node-exporter:latest
    container_name: avtoplaneta-node-exporter
    restart: unless-stopped
    pid: host
    networks:
      - avtoplaneta_network
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: avtoplaneta-cadvisor
    restart: unless-stopped
    privileged: true
    networks:
      - avtoplaneta_network
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  grafana:
    image: grafana/grafana:latest
    container_name: avtoplaneta-grafana
    cpuset: "20-39,60-79"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - avtoplaneta_network
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}

  tempo:
    image: grafana/tempo:latest
    container_name: avtoplaneta-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    expose:
      - "14268"  # jaeger ingest
      - "3200"   # tempo
      - "4317"   # otlp grpc
      - "4318"   # otlp http
      - "9411"   # zipkin
    networks:
      - avtoplaneta_network
    restart: unless-stopped

networks:
  avtoplaneta_network:
    driver: bridge

volumes:
  traefik-logs:
  postgres-data:
  redis-data:
  parts-uploads:
  messaging-uploads:
  prometheus-data:
  grafana-data:
  tempo-data:
